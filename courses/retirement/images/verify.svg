<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Pause before responding</title><desc id="desc">Pause, share nothing, then verify through a known independent route.</desc><rect width="1024" height="440" fill="#eef4f4"/><g fill="#153e50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">Pause before responding</text><text x="35" y="105" font-size="18">AI Introduction · Retirement · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">Pause</text><text x="53" y="238" font-size="18">Unexpected urgent request</text><text x="53" y="292" font-size="16">Do not follow instructions</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">Share nothing</text><text x="375" y="238" font-size="18">No code, payment or reply</text><text x="375" y="292" font-size="16">AI wording is not proof</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">Verify independently</text><text x="697" y="238" font-size="18">Use a known separate contact</text><text x="697" y="292" font-size="16">Sender remains unverified</text><text x="35" y="400" font-size="18">You choose the task, check the result and decide what happens next.</text></g></svg>

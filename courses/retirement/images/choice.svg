<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Choose the tool for the task</title><desc id="desc">Creative options may use a draft; exact totals suit arithmetic; personal preferences remain yours.</desc><rect width="1024" height="440" fill="#eef4f4"/><g fill="#153e50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">Choose the tool for the task</text><text x="35" y="105" font-size="18">AI Introduction · Retirement · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">Creative options</text><text x="53" y="238" font-size="18">Brainstorm or try a draft</text><text x="53" y="292" font-size="16">Review wording and fit</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">Exact totals</text><text x="375" y="238" font-size="18">Use arithmetic or calculator</text><text x="375" y="292" font-size="16">Check the numbers</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">Personal preferences</text><text x="697" y="238" font-size="18">Reflect and decide</text><text x="697" y="292" font-size="16">A tool cannot supply your wishes</text><text x="35" y="400" font-size="18">You choose the task, check the result and decide what happens next.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">A plan must pass every check</title><desc id="desc">Check time, materials and preferences separately. Five plus fifteen plus five plus five equals thirty minutes.</desc><rect width="1024" height="440" fill="#eef4f4"/><g fill="#153e50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">A plan must pass every check</text><text x="35" y="105" font-size="18">AI Introduction · Retirement · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">Time</text><text x="53" y="238" font-size="18">5 + 15 + 5 + 5 = 30</text><text x="53" y="292" font-size="16">Fits the fictional limit</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">Materials</text><text x="375" y="238" font-size="18">Paper, pencil and clips</text><text x="375" y="292" font-size="16">No purchase or extra supplies</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">Preference</text><text x="697" y="238" font-size="18">Keep pieces movable</text><text x="697" y="292" font-size="16">Revise or stop if needed</text><text x="35" y="400" font-size="18">You choose the task, check the result and decide what happens next.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Keep facts and ideas separate</title><desc id="desc">A current notice supports stated duration and capacity. An old flyer does not establish current price. A creative idea is separate.</desc><rect width="1024" height="440" fill="#eef4f4"/><g fill="#153e50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">Keep facts and ideas separate</text><text x="35" y="105" font-size="18">AI Introduction · Retirement · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">Current notice</text><text x="53" y="238" font-size="18">60 minutes; capacity 8</text><text x="53" y="292" font-size="16">Supports these stated facts</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">Old flyer</text><text x="375" y="238" font-size="18">Last season was free</text><text x="375" y="292" font-size="16">Current price is unknown</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">Creative idea</text><text x="697" y="238" font-size="18">Sketch a striped tree</text><text x="697" y="292" font-size="16">A suggestion, not a fact</text><text x="35" y="400" font-size="18">You choose the task, check the result and decide what happens next.</text></g></svg>

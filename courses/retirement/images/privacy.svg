<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Use only the information needed</title><desc id="desc">Define the task, use fictional details or placeholders, and leave out unnecessary private material.</desc><rect width="1024" height="440" fill="#eef4f4"/><g fill="#153e50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">Use only the information needed</text><text x="35" y="105" font-size="18">AI Introduction · Retirement · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">Define the task</text><text x="53" y="238" font-size="18">A fictional invitation</text><text x="53" y="292" font-size="16">No real letter needed</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">Use placeholders</text><text x="375" y="238" font-size="18">[group] and [meeting time]</text><text x="375" y="292" font-size="16">State the requested tone</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#66899c" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">Leave private data out</text><text x="697" y="238" font-size="18">No code or personal history</text><text x="697" y="292" font-size="16">Name removal is not enough</text><text x="35" y="400" font-size="18">You choose the task, check the result and decide what happens next.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Know when to stop drafting</title><desc id="desc">Stop an inappropriate drafting exercise. Do not rely on a safety guarantee. Seek appropriate support when safe.</desc><rect width="1024" height="440" fill="#f3f1f8"/><g fill="#352b50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">Know when to stop drafting</text><text x="35" y="105" font-size="18">AI Introduction · Family · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">Stop the exercise</text><text x="53" y="238" font-size="18">Contact feels unsafe</text><text x="53" y="292" font-size="16">Do not pressure contact</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">Reject guarantees</text><text x="375" y="238" font-size="18">A safe label is not proof</text><text x="375" y="292" font-size="16">No diagnosis from a draft</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">Appropriate support</text><text x="697" y="238" font-size="18">Seek help when safe</text><text x="697" y="292" font-size="16">No course disclosure needed</text><text x="35" y="400" font-size="18">Keep the facts, protect privacy and respect each person's choice.</text></g></svg>

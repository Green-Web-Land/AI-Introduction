<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Choose the role of the tool</title><desc id="desc">A writing draft can offer options. Preferences belong to people. No contact can be the right choice.</desc><rect width="1024" height="440" fill="#f3f1f8"/><g fill="#352b50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">Choose the role of the tool</text><text x="35" y="105" font-size="18">AI Introduction · Family · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">A draft</text><text x="53" y="238" font-size="18">Offers wording options</text><text x="53" y="292" font-size="16">Check facts and fit</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">A preference</text><text x="375" y="238" font-size="18">Belongs to the person</text><text x="375" y="292" font-size="16">Do not infer permission</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">No contact</text><text x="697" y="238" font-size="18">Can be the right choice</text><text x="697" y="292" font-size="16">Respect the stated boundary</text><text x="35" y="400" font-size="18">Keep the facts, protect privacy and respect each person's choice.</text></g></svg>

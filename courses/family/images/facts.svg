<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Keep three kinds of statement apart</title><desc id="desc">Observation: no reply received. Interpretation: a guessed motive. Unknown: reading, reasons and attendance.</desc><rect width="1024" height="440" fill="#f3f1f8"/><g fill="#352b50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">Keep three kinds of statement apart</text><text x="35" y="105" font-size="18">AI Introduction · Family · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">Observation</text><text x="53" y="238" font-size="18">No reply received</text><text x="53" y="292" font-size="16">This is the supplied fact</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">Interpretation</text><text x="375" y="238" font-size="18">A guessed motive</text><text x="375" y="292" font-size="16">Plausible is not proven</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">Unknown</text><text x="697" y="238" font-size="18">Reading or attendance</text><text x="697" y="292" font-size="16">Do not fill the gap</text><text x="35" y="400" font-size="18">Keep the facts, protect privacy and respect each person's choice.</text></g></svg>

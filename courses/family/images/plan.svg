<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">A fitting time is still a proposal</title><desc id="desc">Availability overlaps from 14:30 to 15:00. A 20-minute proposal can fit, but participation still needs confirmation.</desc><rect width="1024" height="440" fill="#f3f1f8"/><g fill="#352b50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">A fitting time is still a proposal</text><text x="35" y="105" font-size="18">AI Introduction · Family · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">Availability overlap</text><text x="53" y="238" font-size="18">14:30 to 15:00</text><text x="53" y="292" font-size="16">30 minutes in common</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">Possible conversation</text><text x="375" y="238" font-size="18">14:30 to 14:50</text><text x="375" y="292" font-size="16">20 minutes; no recording</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">Confirmation</text><text x="697" y="238" font-size="18">Attendance not agreed</text><text x="697" y="292" font-size="16">Ask; allow a decline</text><text x="35" y="400" font-size="18">Keep the facts, protect privacy and respect each person's choice.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Agreement has a specific scope</title><desc id="desc">Agreement to one unrecorded chat does not authorize recording, publication or future appointments.</desc><rect width="1024" height="440" fill="#f3f1f8"/><g fill="#352b50" font-family="Arial, sans-serif"><text x="35" y="65" font-size="30" font-weight="bold">Agreement has a specific scope</text><text x="35" y="105" font-size="18">AI Introduction · Family · fictional teaching examples</text><rect x="35" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="53" y="185" font-size="22" font-weight="bold">Agreed</text><text x="53" y="238" font-size="18">One chat, no recording</text><text x="53" y="292" font-size="16">Keep the stated condition</text><rect x="357" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="375" y="185" font-size="22" font-weight="bold">Not established</text><text x="375" y="238" font-size="18">Recording or publication</text><text x="375" y="292" font-size="16">These are different uses</text><rect x="679" y="145" width="300" height="205" rx="16" fill="#fff" stroke="#8f81a7" stroke-width="2"/><text x="697" y="185" font-size="22" font-weight="bold">Future contact</text><text x="697" y="238" font-size="18">No standing appointment</text><text x="697" y="292" font-size="16">Do not assume agreement</text><text x="35" y="400" font-size="18">Keep the facts, protect privacy and respect each person's choice.</text></g></svg>

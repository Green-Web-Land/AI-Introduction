<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Two possible futures</title><desc id="desc">Two open books: a suggestion of moon garden and a story without a tool. People choose in both.</desc><rect width="1000" height="500" fill="#f6f8f3"/><g font-family="Arial, sans-serif" fill="#20394c"><text x="40" y="55" font-size="34">Two possible futures</text><text x="40" y="96" font-size="23">We can imagine. We cannot know every change.</text><text x="75" y="153" font-size="25">With a suggestion</text><path d="M75 209q75-25 140 0 q65-25 140 0v120q-75-25-140 0q-65-25-140 0Z" fill="#fff" stroke="#243d55" stroke-width="5"/><path d="M215 209v120" stroke="#243d55" stroke-width="4"/><text x="90" y="250" font-size="18">Moon garden</text><text x="254" y="282" font-size="19">My choice</text><text x="559" y="153" font-size="25">Without a tool</text><path d="M559 209q75-25 140 0 q65-25 140 0v120q-75-25-140 0q-65-25-140 0Z" fill="#fff" stroke="#243d55" stroke-width="5"/><path d="M699 209v120" stroke="#243d55" stroke-width="4"/><text x="581" y="250" font-size="21">Our story</text><text x="739" y="282" font-size="19">My choice</text><text x="180" y="405" font-size="29">People can choose in both stories.</text><text x="40" y="478" font-size="17">AI Introduction — Young Children · Read with a grown-up · CC BY 4.0</text></g></svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Shorten the activities, show the tradeoff</title><desc id="d">14:00–14:05 setup. 14:05–14:15 drawing. 10 minutes drawing. 14:15–14:25 story. 14:25–14:35 break. 10 minutes each. 14:35–14:40 put away. Total: 40 minutes. Choose or revise freely</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Shorten the activities, show the tradeoff</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Start</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">14:00–14:05 setup</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">14:05–14:15 drawing</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">10 minutes drawing</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Middle</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">14:15–14:25 story</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">14:25–14:35 break</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">10 minutes each</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Finish</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">14:35–14:40 put away</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Total: 40 minutes</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Choose or revise freely</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">An 8-minute interruption leaves 32 minutes within the original window.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">A fictional plan for sixty minutes</title><desc id="d">Setup: 5 minutes. Paper and pencils. Quiet indoor options. Drawing: 20 minutes. Storytelling: 20 minutes. Spoken or written. Break: 10 minutes. Putting away: 5 minutes. Total: 60 minutes</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">A fictional plan for sixty minutes</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Beginning</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Setup: 5 minutes</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Paper and pencils</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Quiet indoor options</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Activities</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Drawing: 20 minutes</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Storytelling: 20 minutes</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Spoken or written</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Break and finish</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Break: 10 minutes</text><
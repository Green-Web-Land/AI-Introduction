<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">A suggestion is not an action</title><desc id="d">Draft an invitation. List materials. Suggest a time. Exact item and destination. Actual permission. No live action in this course. Unknown is not confirmed. Inspect before repeating. Do not invent receipt</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">A suggestion is not an action</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Prepare</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Draft an invitation</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">List materials</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Suggest a time</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Decide and review</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Exact item and destination</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Actual permission</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">No live action in this course</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Check the result</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Unknown is not confirmed</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Inspect before repeating</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Do not invent receipt</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Purchases, bookings, sending and device commands require their own authority.</text></svg>

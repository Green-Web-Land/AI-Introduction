<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Practise without private household data</title><desc id="d">Invent a place and activity. Label the draft. No actual guest list. No bills or passwords. No private calendar images. Names are not the only clues. Others may decline. Do not infer consent. Keep alternatives available</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Practise without private household data</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Use fiction</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Invent a place and activity</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Label the draft</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">No actual guest list</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Leave out private records</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">No bills or passwords</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">No private calendar images</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Names are not the only clues</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Respect choice</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Others may decline</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Do not infer consent</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">Keep alternatives available</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="17" fill="#253d4b">A prompt does not implement privacy safeguards.</text></svg>

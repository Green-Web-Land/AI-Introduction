<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Zero is a value; missing is not zero</title><desc id="d">0, 4, missing, 8. Use the stated rule. Do not invent a value. Keep 0, 4 and 8. Sum = 12; count = 3. Mean = 4. Dropping 0 gives 6. That changes the rule. No values → unavailable</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Zero is a value; missing is not zero</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Input</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">0, 4, missing, 8</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Use the stated rule</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Do not invent a value</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Retain and count</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Keep 0, 4 and 8</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Sum = 12; count = 3</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Mean = 4</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Check the result</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Dropping 0 gives 6</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">That changes the rule</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">No values → unavailable</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Paper procedure • Real datasets need their own definitions and documented methods.</text></svg>

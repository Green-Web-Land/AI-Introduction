<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Keep a record you can inspect</title><desc id="d">Define the outcome. Read the applicable rule. No AI is also an option. Inspect actual records. Record versions and steps. Check the calculation. Describe your contribution. Name remaining uncertainty. Revise when evidence changes</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Keep a record you can inspect</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Question and permission</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Define the outcome</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Read the applicable rule</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">No AI is also an option</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Source and method</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Inspect actual records</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Record versions and steps</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Check the calculation</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Explain and revisit</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Describe your contribution</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Name remaining uncertainty</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Revise when evidence changes</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Future scenarios are conditional • No guaranteed degree, job or learning gain.</text></svg>

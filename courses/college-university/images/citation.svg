<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">A citation is the start of a check</title><desc id="d">Title, version, section. Record A: pilot, version 1. No invented reference. Completion time. No retention measure. Volunteers chose rooms. Time is not learning. B repeats A's evidence. Unsupported claim stays open</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">A citation is the start of a check</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">1 • Find the record</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Title, version, section</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Record A: pilot, version 1</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">No invented reference</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">2 • Inspect the measure</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Completion time</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">No retention measure</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Volunteers chose rooms</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">3 • Match the claim</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Time is not learning</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">B repeats A's evidence</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Unsupported claim stays open</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Fictional packet • Finding a record does not validate every sentence attached to it.</text></svg>

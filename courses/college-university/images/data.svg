<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Report the version and denominator</title><desc id="d">Q: 60 ÷ 6 = 10 min. R: 72 ÷ 6 = 12 min. Difference: 2 min. Q: 66 ÷ 6 = 11 min. R remains 12 min. Difference: 1 min. 2 ÷ 12 ≈ 16.7%. 1 ÷ 12 ≈ 8.3%. Not a learning effect</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Report the version and denominator</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Version 1</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Q: 60 ÷ 6 = 10 min</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">R: 72 ÷ 6 = 12 min</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Difference: 2 min</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Version 2 correction</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Q: 66 ÷ 6 = 11 min</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">R remains 12 min</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Difference: 1 min</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Keep the limit</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">2 ÷ 12 ≈ 16.7%</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">1 ÷ 12 ≈ 8.3%</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Not a learning effect</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Invented observations • Correct arithmetic does not establish cause.</text></svg>

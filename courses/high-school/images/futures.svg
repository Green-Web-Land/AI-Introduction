<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Prediction means examining possibilities</title><desc id="desc">Make an attempt. Check with evidence. Keep independent skills. A record of your reasoning. Or unexamined answers. Neither result is inevitable. Access and teaching matter. Privacy safeguards matter. Review new evidence</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Prediction means examining possibilities</text><rect x="32" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Now • Choose a habit</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Make an attempt</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Check with evidence</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Keep independent skills</text><rect x="356" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">In 3 years • A possibility</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">A record of your reasoning</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Or unexamined answers</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Neither result is inevitable</text><rect x="680" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">In 5 years • Conditions</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Access and teaching matter</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Privacy safeguards matter</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Review new evidence</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Conditional scenarios • No promised grades, jobs, probabilities or guaranteed future.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Count values at least 5</title><desc id="desc">Start count at 0. Values: 3, 5, 7, 5. Include equality: &gt;= 5. 3 → 0  |  5 → 1. 7 → 2  |  5 → 3. Final count: 3. &gt; 5 counts only 7. Buggy count: 1. Exactly 5 tests the boundary</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Count values at least 5</text><rect x="32" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Rule and input</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Start count at 0</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Values: 3, 5, 7, 5</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Include equality: &gt;= 5</text><rect x="356" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Correct running counts</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">3 → 0  |  5 → 1</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">7 → 2  |  5 → 3</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Final count: 3</text><rect x="680" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Compare the bug</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">&gt; 5 counts only 7</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Buggy count: 1</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Exactly 5 tests the boundary</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Paper pseudocode only • These examples do not prove a larger program is correct.</text></svg>

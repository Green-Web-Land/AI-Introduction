<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">What did the source measure?</title><desc id="desc">20 volunteers. 12 prefer new tables. No learning measure. 12 ÷ 20 = 60%. Preference in this pilot. Limited group. “Everyone learns better”. Preference is not learning. A repost is not a new study</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">What did the source measure?</text><rect x="32" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Fictional Record A</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">20 volunteers</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">12 prefer new tables</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">No learning measure</text><rect x="356" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Supported statement</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">12 ÷ 20 = 60%</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Preference in this pilot</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Limited group</text><rect x="680" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Unsupported leap</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">“Everyone learns better”</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Preference is not learning</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">A repost is not a new study</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Fictional packet • A correction to 10 of 20 changes the percentage to 50%.</text></svg>

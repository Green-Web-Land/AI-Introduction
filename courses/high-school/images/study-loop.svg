<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Keep the thinking with you</title><desc id="desc">Show what you tried. Name the stuck step. Keep the task specific. Ask for one clue. Do the next step yourself. Notice excessive help. Test the reasoning. Try a different example. Explain it without help</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Keep the thinking with you</text><rect x="32" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">1 • Attempt</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Show what you tried</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Name the stuck step</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Keep the task specific</text><rect x="356" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">2 • Hint, if allowed</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Ask for one clue</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Do the next step yourself</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Notice excessive help</text><rect x="680" y="104" width="308" height="280" rx="14" fill="#ffffff" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">3 • Check and transfer</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Test the reasoning</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Try a different example</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Explain it without help</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">This is a practice method, not a guarantee that an AI will follow instructions.</text></svg>

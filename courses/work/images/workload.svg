<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Counts matter in the average</title><desc id="d">4 × 15 + 3 × 20 + 2 × 30. 180 minutes; 9 tasks. Mean: 20 minutes. B becomes 4 × 20 = 80. 200 minutes; 10 tasks. Mean: 20 minutes. Estimates for this list. Not an employee ranking. Priority needs its own rule</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Counts matter in the average</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Original list</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">4 × 15 + 3 × 20 + 2 × 30</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">180 minutes; 9 tasks</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Mean: 20 minutes</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Corrected B count</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">B becomes 4 × 20 = 80</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">200 minutes; 10 tasks</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Mean: 20 minutes</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Interpretation</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Estimates for this list</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Not an employee ranking</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Priority needs its own rule</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Invented workload • Correct arithmetic does not authorize staffing decisions.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">A draft is not a completed action</title><desc id="d">Use supplied facts. Keep uncertainty visible. Do not send here. Content and version. Destination and scope. Actual authority. Inspect the result. Unknown is not failed. Avoid blind retries</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">A draft is not a completed action</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Prepare</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Use supplied facts</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Keep uncertainty visible</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Do not send here</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Review the exact action</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Content and version</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Destination and scope</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Actual authority</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Verify</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Inspect the result</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Unknown is not failed</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Avoid blind retries</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Paper exercise only • Sending, record changes and code execution are separate actions.</text></svg>

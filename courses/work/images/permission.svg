<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Check three kinds of permission</title><desc id="d">What output is allowed?. Draft or final use?. Who checks it?. What inputs may be used?. Use invented data here. No real private records. What may change?. Drafting is not sending. Confirm the actual authority</desc><rect width="1000" height="500" fill="#f2f6fa"/><text x="36" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334a">Check three kinds of permission</text><rect x="32" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="48" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Task</text><text x="48" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">What output is allowed?</text><text x="48" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Draft or final use?</text><text x="48" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Who checks it?</text><rect x="356" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="372" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Information</text><text x="372" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">What inputs may be used?</text><text x="372" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Use invented data here</text><text x="372" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">No real private records</text><rect x="680" y="104" width="308" height="280" rx="14" fill="white" stroke="#557c91" stroke-width="2"/><text x="696" y="147" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#15334a">Action</text><text x="696" y="204" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">What may change?</text><text x="696" y="261" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Drafting is not sending</text><text x="696" y="318" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Confirm the actual authority</text><text x="36" y="442" font-family="Arial,sans-serif" font-size="18" fill="#253d4b">Fictional exercises • Tool capability does not establish workplace permission.</text></svg>
